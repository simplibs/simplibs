[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplibs"
version = "0.1.1"
description = "Namespace root for the simplibs ecosystem of small, focused Python libraries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "namespace",
    "simplibs",
    "simple",
    "ecosystem",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[[project.authors]]
name = "Dalibor Sova (Sudip2708)"
email = "daliborsova@seznam.cz"

[project.urls]
Homepage = "https://github.com/simple-libs"
Repository = "https://github.com/simple-libs"
Issues = "https://github.com/simple-libs/issues"
